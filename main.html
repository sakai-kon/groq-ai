<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Groq AI</title>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(','\\)'], ['$','$']],
    displayMath: [['\\[','\\]'], ['$$','$$']],
    processEscapes: true
  },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
<style>
*{box-sizing:border-box}
:root{color-scheme:light;--bg:#fff;--text:#222;--muted:#737373;--line:#e2e2e2;--soft:#f7f7f7;--input:#fff;--link:#2456a6;--quote:#fafafa}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body.dark{color-scheme:dark;--bg:#111;--text:#eee;--muted:#aaa;--line:#333;--soft:#1d1d1d;--input:#191919;--link:#a9c6ff;--quote:#1b1b1b}
button,input,textarea,select{font:inherit}
button{padding:8px 12px;border:1px solid var(--line);border-radius:7px;background:var(--input);color:var(--text);cursor:pointer}
button:hover{background:var(--soft)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #777;outline-offset:2px}
header{min-height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 14px;background:var(--bg)}
.brand{font-weight:650;white-space:nowrap}.spacer{flex:1}
.model-wrap{display:flex;align-items:center;gap:7px;min-width:0}.model-label{font-size:12px;color:var(--muted);white-space:nowrap}
select{width:min(330px,43vw);min-width:130px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--input);color:var(--text);font-size:13px;font-weight:500}
main{height:calc(100dvh - 58px);max-width:800px;margin:auto;padding:0 16px;display:flex;flex-direction:column}
#messages{flex:1;overflow:auto;padding:24px 0}.welcome{color:var(--muted);padding:18px 0}
.message{padding:14px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.role{font-size:12px;color:var(--muted);margin-bottom:5px}
.md-body{line-height:1.7;overflow-wrap:anywhere}
.md-body p{margin:0 0 10px}.md-body p:last-child{margin-bottom:0}
.md-body h1,.md-body h2,.md-body h3,.md-body h4,.md-body h5,.md-body h6{line-height:1.35;margin:18px 0 8px;font-weight:650}
.md-body h1{font-size:1.45em}.md-body h2{font-size:1.28em}.md-body h3{font-size:1.12em}
.md-body ul,.md-body ol{margin:8px 0;padding-left:25px}.md-body li{margin:3px 0}
.md-body blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid #999;background:var(--quote);color:var(--muted)}
.md-body code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:1px 4px;font-size:.9em}
.md-body pre{max-width:100%;overflow:auto;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:12px;margin:10px 0;white-space:pre}
.md-body pre code{background:none;border:0;padding:0;border-radius:0;font-size:13px;white-space:pre}
.md-body a{color:var(--link);text-decoration:underline;overflow-wrap:anywhere}
.md-body hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.table-wrap{max-width:100%;overflow-x:auto;margin:10px 0}.md-body table{border-collapse:collapse;width:100%;font-size:.92em}
.md-body th,.md-body td{border:1px solid var(--line);padding:7px 9px;text-align:left}.md-body th{background:var(--soft);font-weight:600}
.math-block{max-width:100%;overflow-x:auto;padding:7px 0}.md-body mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}.md-body mjx-container[display="true"]{margin:12px 0!important}
.message-actions{display:flex;gap:7px;margin-top:10px}.message-actions button{font-size:12px;padding:5px 9px;color:var(--muted)}
.composer{padding:10px 0 max(12px,env(safe-area-inset-bottom));background:var(--bg)}
.box{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);border-radius:9px;padding:7px;background:var(--input)}
textarea{flex:1;min-width:0;min-height:40px;max-height:180px;resize:vertical;border:0;outline:none!important;padding:7px;color:var(--text);background:transparent}
.send{background:var(--text);color:var(--bg);border-color:var(--text)}.send:hover{opacity:.85}
.note{font-size:11px;color:var(--muted);margin-top:6px}.status{font-size:12px}
.search-line{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px;color:var(--muted)}.search-line input{width:15px;height:15px;margin:0;accent-color:var(--text)}.search-hint{font-size:11px}
dialog{width:min(440px,calc(100vw - 28px));border:1px solid var(--line);border-radius:9px;padding:18px;background:var(--bg);color:var(--text)}
dialog::backdrop{background:#0007}h2{font-size:18px;margin:0 0 16px}
.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:14px}
.field input[type=password],.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px;background:var(--input);color:var(--text)}
.small{font-size:12px;color:var(--muted)}.check{display:flex;align-items:center;gap:8px;font-size:13px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:500px){header{padding:0 9px;gap:6px}.brand{font-size:14px}.model-wrap{gap:4px}.model-label{display:none}select{width:36vw;min-width:100px;max-width:155px;font-size:12px;padding:7px 4px}header button{font-size:13px;padding:7px 8px}main{padding:0 11px}#messages{padding-top:16px}}
</style>
</head>
<body>
<header>
  <span class="brand">Groq AI</span><span class="spacer"></span>
  <div class="model-wrap"><span class="model-label">モデル</span>
    <select id="model" aria-label="モデルを選択">
      <option value="openai/gpt-oss-120b">GPT-OSS 120B — 高性能・検索</option>
      <option value="openai/gpt-oss-20b">GPT-OSS 20B — 高速・検索</option>
      <option value="llama-3.3-70b-versatile">Llama 3.3 70B — 通常チャット</option>
    </select>
  </div>
  <button id="themeToggle" type="button" aria-label="白黒切替">黒</button>
  <button id="new" type="button">新規</button>
  <button id="openSettings" type="button">設定</button>
</header>
<main>
  <div id="messages" aria-live="polite"><div class="welcome">メッセージを入力して始めてください。</div></div>
  <div class="composer">
    <div class="box">
      <textarea id="prompt" rows="1" placeholder="メッセージを入力…" aria-label="メッセージ"></textarea>
      <button id="stop" type="button" disabled>停止</button>
      <button id="send" class="send" type="button">送信</button>
    </div>
    <label class="search-line"><input id="webSearch" type="checkbox"><span>Web検索を使う</span><span class="search-hint">検索中はGPT-OSSに自動切替</span></label>
    <div class="note"><span id="status" class="status">準備完了</span> · 個人情報は入力しないでください。AIの回答は間違うことがあります。</div>
  </div>
</main>
<dialog id="settings">
  <form id="form">
    <h2>設定</h2>
    <div class="field">
      <label for="key">Groq APIキー</label>
      <input id="key" type="password" autocomplete="off" placeholder="gsk_…">
      <div class="small">共有端末ではキーを保存せず、使用後に削除してください。</div>
      <label class="check"><input id="remember" type="checkbox">この端末にAPIキーを保存する</label>
    </div>
    <div class="field"><label for="instruction">追加指示（省略可）</label><textarea id="instruction" rows="3" placeholder="例：中学生にもわかる言葉で説明する"></textarea></div>
    <div class="small">Web検索はGroqの組み込み browser_search を利用します。検索にはGPT-OSS 20B / 120Bが必要です。</div>
    <div class="actions"><button id="deleteKey" type="button">キーを削除</button><button id="close" type="button">閉じる</button><button type="submit" class="send">保存</button></div>
  </form>
</dialog>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var apiKey=sessionStorage.getItem('groq-key-session')||localStorage.getItem('groq-key')||'';
var remember=!!localStorage.getItem('groq-key');
var instruction=sessionStorage.getItem('groq-instruction')||'';
var messages=[],busy=false,controller=null;
var SEARCH_MODELS=['openai/gpt-oss-120b','openai/gpt-oss-20b'];
function status(text){$('status').textContent=text;}
function safeError(statusCode,detail){
 var friendly={
  400:'検索リクエストがGroq APIに受け付けられませんでした。モデルや検索ツールの対応状況を確認してください。',
  401:'APIキーが正しくないか、無効になっています。「設定」でキーを確認してください。',
  403:'このAPIキーにはリクエストを実行する権限がありません。',
  404:'選択したモデルまたはAPI機能が見つかりません。別のGPT-OSSモデルを選んでください。',
  408:'リクエストがタイムアウトしました。もう一度お試しください。',
  413:'会話が長すぎます。新しいチャットでお試しください。',
  429:'Groqの利用上限またはレート制限に達しました。少し待ってから再試行してください。',
  500:'Groq側で一時的なエラーが発生しました。少し待ってから再試行してください。',
  502:'Groq側への接続でエラーが発生しました。少し待ってから再試行してください。',
  503:'Groqのサービスが一時的に利用できません。少し待ってから再試行してください。'
 };
 return (friendly[statusCode]||('Groq APIでエラー（HTTP '+statusCode+'）が発生しました。'))+(detail?'\n詳細: '+String(detail).slice(0,500):'');
}
function currentModel(){return $('model').value||SEARCH_MODELS[0];}
function setModel(id){$('model').value=id;}
function render(){
 var el=$('messages');
 if(window.MathJax&&window.MathJax.typesetClear){try{window.MathJax.typesetClear([el]);}catch(ignore){}}
 el.replaceChildren();
 if(!messages.length){var welcome=document.createElement('div');welcome.className='welcome';welcome.textContent='メッセージを入力して始めてください。';el.appendChild(welcome);return;}
 messages.forEach(function(message,index){
  var item=document.createElement('section');item.className='message';
  var role=document.createElement('div');role.className='role';role.textContent=message.role==='user'?'あなた':'Groq AI';
  var body=document.createElement('div');body.className='md-body';renderMarkdown(body,message.content||'');
  item.appendChild(role);item.appendChild(body);
  if(message.role==='assistant'&&!busy&&message.content){
   var actions=document.createElement('div');actions.className='message-actions';
   var copy=document.createElement('button');copy.type='button';copy.textContent='回答をコピー';copy.onclick=function(){copyText(message.content);};
   var regen=document.createElement('button');regen.type='button';regen.textContent='再生成';regen.onclick=function(){regenerate(index);};
   actions.appendChild(copy);actions.appendChild(regen);item.appendChild(actions);
  }
  el.appendChild(item);
 });
 el.scrollTop=el.scrollHeight;
}
function appendInline(parent,text){
 var source=String(text||'');
 var pattern=/(\$\$[\s\S]+?\$\$|\$[^$\n]+\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\))|\x60([^\x60\n]+)\x60|\[([^\]\n]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)|\*\*([^*\n]+)\*\*|__([^_\n]+)__|~~([^~\n]+)~~|\*([^*\n]+)\*|_([^_\n]+)_/g;
 var pos=0,match;
 function addText(value){
  var parts=value.split('\n');
  parts.forEach(function(part,index){if(index)parent.appendChild(document.createElement('br'));if(part)parent.appendChild(document.createTextNode(part));});
 }
 while((match=pattern.exec(source))){
  addText(source.slice(pos,match.index));
  if(match[1]!==undefined){parent.appendChild(document.createTextNode(match[1]));}
  else if(match[2]!==undefined){var code=document.createElement('code');code.textContent=match[2];parent.appendChild(code);}
  else if(match[3]!==undefined){
   var href=match[4],valid=false;
   try{var u=new URL(href,location.href);valid=['https:','http:','mailto:'].includes(u.protocol);}catch(ignore){}
   if(valid){var a=document.createElement('a');a.href=href;a.target='_blank';a.rel='noopener noreferrer';appendInline(a,match[3]);parent.appendChild(a);}
   else parent.appendChild(document.createTextNode(match[0]));
  }else{
   var tag,inside;
   if(match[5]!==undefined||match[6]!==undefined){tag='strong';inside=match[5]!==undefined?match[5]:match[6];}
   else if(match[7]!==undefined){tag='del';inside=match[7];}
   else{tag='em';inside=match[8]!==undefined?match[8]:match[9];}
   var node=document.createElement(tag);appendInline(node,inside);parent.appendChild(node);
  }
  pos=pattern.lastIndex;
 }
 addText(source.slice(pos));
}
function splitTableRow(line){
 return line.trim().replace(/^\|/,'').replace(/\|$/,'').split(/(?<!\\)\|/).map(function(cell){return cell.trim().replace(/\\\|/g,'|');});
}
function renderMarkdown(parent,source){
 var lines=String(source||'').replace(/\r\n?/g,'\n').split('\n'),i=0;
 function fence(line){return /^ {0,3}(\x60{3,}|~{3,})/.test(line);}
 function list(line){return /^ {0,3}(?:[-+*]|\d{1,9}[.)])\s+/.test(line);}
 function rule(line){return /^ {0,3}(?:(?:-\s*){3,}|(?:\*\s*){3,}|(?:_\s*){3,})$/.test(line);}
 function heading(line){return /^ {0,3}#{1,6}\s+/.test(line);}
 function quote(line){return /^ {0,3}>\s?/.test(line);}
 function mathStart(line){return /^\s*(\$\$|\\\[)/.test(line);}
 function tableStart(at){return at+1<lines.length&&lines[at].includes('|')&&/^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[at+1]);}
 function block(at){var x=lines[at]||'';return fence(x)||mathStart(x)||heading(x)||rule(x)||quote(x)||list(x)||tableStart(at);}
 while(i<lines.length){
  var line=lines[i];
  if(!line.trim()){i++;continue;}
  var fenced=line.match(/^ {0,3}(\x60{3,}|~{3,})(.*)$/);
  if(fenced){
   var mark=fenced[1][0],length=fenced[1].length,codeLines=[];i++;
   while(i<lines.length){var closing=lines[i].match(/^ {0,3}(\x60{3,}|~{3,})\s*$/);if(closing&&closing[1][0]===mark&&closing[1].length>=length){i++;break;}codeLines.push(lines[i++]);}
   var pre=document.createElement('pre'),code=document.createElement('code');code.textContent=codeLines.join('\n');pre.appendChild(code);parent.appendChild(pre);continue;
  }
  var displayMath=line.match(/^\s*(\$\$|\\\[)/);
  if(displayMath){
   var delimiter=displayMath[1],close=delimiter==='$$'?'$$':'\\]',mathLines=[line];
   var closed=line.slice(displayMath[0].length).indexOf(close)>=0;i++;
   while(!closed&&i<lines.length){var ml=lines[i++];mathLines.push(ml);if(ml.indexOf(close)>=0)closed=true;}
   var math=document.createElement('div');math.className='math-block';math.textContent=mathLines.join('\n');parent.appendChild(math);continue;
  }
  var h=line.match(/^ {0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
  if(h){var hn=document.createElement('h'+h[1].length);appendInline(hn,h[2]);parent.appendChild(hn);i++;continue;}
  if(rule(line)){parent.appendChild(document.createElement('hr'));i++;continue;}
  if(quote(line)){
   var q=[];while(i<lines.length&&quote(lines[i]))q.push(lines[i++].replace(/^ {0,3}>\s?/,''));
   var blockquote=document.createElement('blockquote');renderMarkdown(blockquote,q.join('\n'));parent.appendChild(blockquote);continue;
  }
  if(tableStart(i)){
   var heads=splitTableRow(lines[i]);i+=2;
   var table=document.createElement('table'),thead=document.createElement('thead'),tr=document.createElement('tr');
   heads.forEach(function(cell){var th=document.createElement('th');appendInline(th,cell);tr.appendChild(th);});thead.appendChild(tr);table.appendChild(thead);
   var tbody=document.createElement('tbody');
   while(i<lines.length&&lines[i].trim()&&lines[i].includes('|')&&!block(i)){
    var cells=splitTableRow(lines[i]),row=document.createElement('tr');
    heads.forEach(function(_,n){var td=document.createElement('td');appendInline(td,cells[n]||'');row.appendChild(td);});tbody.appendChild(row);i++;
   }
   table.appendChild(tbody);var wrap=document.createElement('div');wrap.className='table-wrap';wrap.appendChild(table);parent.appendChild(wrap);continue;
  }
  var lm=line.match(/^ {0,3}([-+*]|\d{1,9}[.)])\s+(.*)$/);
  if(lm){
   var ordered=/^\d/.test(lm[1]),listNode=document.createElement(ordered?'ol':'ul');
   while(i<lines.length){var itemMatch=lines[i].match(/^ {0,3}([-+*]|\d{1,9}[.)])\s+(.*)$/);if(!itemMatch||/^\d/.test(itemMatch[1])!==ordered)break;var li=document.createElement('li');appendInline(li,itemMatch[2]);listNode.appendChild(li);i++;}
   parent.appendChild(listNode);continue;
  }
  var paragraph=[];while(i<lines.length&&lines[i].trim()&&!block(i)){paragraph.push(lines[i]);i++;}
  if(!paragraph.length)paragraph.push(lines[i++]);
  var p=document.createElement('p');paragraph.forEach(function(part,n){if(n)p.appendChild(document.createElement('br'));appendInline(p,part);});parent.appendChild(p);
 }
}
function typesetMath(){
 if(!window.MathJax||typeof window.MathJax.typesetPromise!=='function')return;
 var el=$('messages');
 try{if(window.MathJax.typesetClear)window.MathJax.typesetClear([el]);}catch(ignore){}
 window.MathJax.typesetPromise([el]).catch(function(){status('数式ライブラリの読み込みに失敗。LaTeX文字列で表示中');});
}
window.addEventListener('load',function(){if(messages.length)typesetMath();});
function copyText(text){
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){status('回答をコピーしました');}).catch(function(){fallbackCopy(text);});}
 else fallbackCopy(text);
}
function fallbackCopy(text){
 var el=document.createElement('textarea');el.value=text;el.setAttribute('readonly','');el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();
 var ok=false;try{ok=document.execCommand('copy');}catch(ignore){}el.remove();status(ok?'回答をコピーしました':'コピーできませんでした');
}
async function regenerate(index){
 if(busy||!messages[index]||messages[index].role!=='assistant')return;
 var userIndex=index-1;while(userIndex>=0&&messages[userIndex].role!=='user')userIndex--;
 if(userIndex<0){status('再生成する質問が見つかりません');return;}
 messages=messages.slice(0,userIndex+1);
 await send(true);
}
function saveSettings(){
 apiKey=$('key').value.trim();remember=$('remember').checked;instruction=$('instruction').value.trim();
 if(remember&&apiKey){localStorage.setItem('groq-key',apiKey);sessionStorage.removeItem('groq-key-session');}
 else{localStorage.removeItem('groq-key');if(apiKey)sessionStorage.setItem('groq-key-session',apiKey);else sessionStorage.removeItem('groq-key-session');}
 sessionStorage.setItem('groq-instruction',instruction);
}
function setBusy(on){busy=on;$('send').disabled=on;$('stop').disabled=!on;}
function responseErrorMessage(statusCode,detail){
 var message={
  400:'検索リクエストが拒否されました。モデルIDやブラウザ検索ツールの対応を確認してください。',
  401:'APIキーが無効です。設定でAPIキーを確認してください。',
  403:'APIキーまたはプロジェクトに必要な権限がありません。',
  404:'モデルが見つかりません。GPT-OSS 120Bまたは20Bを選び直してください。',
  408:'リクエストがタイムアウトしました。再試行してください。',
  413:'送信内容が大きすぎます。新しいチャットで試してください。',
  429:'利用上限またはレート制限です。少し待ってから再試行してください。',
  500:'Groqサーバー側の一時エラーです。少し待ってから再試行してください。',
  502:'Groqへの接続に失敗しました。ネットワークを確認してください。',
  503:'Groqサービスが一時的に利用できません。後でもう一度試してください。'
 };
 return (message[statusCode]||('APIエラー（HTTP '+statusCode+'）'))+(detail?'\n詳細: '+String(detail).slice(0,450):'');
}
async function send(isRegenerate){
 if(busy)return;
 var text='';
 if(isRegenerate){var last=messages[messages.length-1];if(!last||last.role!=='user'){status('再生成する質問が見つかりません');return;}text=last.content;}
 else{text=$('prompt').value.trim();if(!text)return;}
 if(!apiKey){$('settings').showModal();status('APIキーを設定してください');return;}
 var webSearch=$('webSearch').checked;
 if(webSearch&&!SEARCH_MODELS.includes(currentModel())){setModel('openai/gpt-oss-120b');}
 if(!isRegenerate)messages.push({role:'user',content:text});
 $('prompt').value='';
 setBusy(true);controller=new AbortController();
 messages.push({role:'assistant',content:''});render();
 status(webSearch?'Web検索中…':'生成中…');
 try{
  var system='あなたは親切で正確なAIアシスタントです。日本語でわかりやすく回答してください。適切な場合はMarkdownやLaTeXの数式を使用してください。'+(instruction?'\n追加指示: '+instruction:'');
  var context=[{role:'system',content:system}].concat(messages.slice(0,-1).map(function(m){return {role:m.role,content:m.content};}));
  if(webSearch){
   var searchResponse=await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{Authorization:'Bearer '+apiKey,'Content-Type':'application/json'},
    body:JSON.stringify({model:currentModel(),messages:context,temperature:1,max_completion_tokens:2048,top_p:1,stream:false,stop:null,reasoning_effort:'medium',tool_choice:'required',tools:[{type:'browser_search'}]}),
    signal:controller.signal
   });
   if(!searchResponse.ok){var searchDetail=await searchResponse.text();throw Object.assign(new Error(responseErrorMessage(searchResponse.status,searchDetail)),{handled:true});}
   var searchData=await searchResponse.json();
   var searchText=searchData&&searchData.choices&&searchData.choices[0]&&searchData.choices[0].message&&searchData.choices[0].message.content;
   if(typeof searchText!=='string'||!searchText.trim())throw Object.assign(new Error('検索結果が空でした。質問を具体的にしてもう一度試してください。'),{handled:true});
   messages[messages.length-1].content=searchText;
   status('検索完了');
  }else{
   var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',headers:{Authorization:'Bearer '+apiKey,'Content-Type':'application/json'},
    body:JSON.stringify({model:currentModel(),messages:context,temperature:0.5,stream:true}),
    signal:controller.signal
   });
   if(!r.ok){var normalDetail=await r.text();throw Object.assign(new Error(responseErrorMessage(r.status,normalDetail)),{handled:true});}
   var reader=r.body.getReader(),decoder=new TextDecoder(),buffer='',done=false;
   while(!done){
    var part=await reader.read();if(part.done)break;
    buffer+=decoder.decode(part.value,{stream:true});
    var lines=buffer.split('\n');buffer=lines.pop()||'';
    for(var i=0;i<lines.length;i++){
     var line=lines[i].trim();if(line.indexOf('data:')!==0)continue;
     var chunk=line.slice(5).trim();if(chunk==='[DONE]'){done=true;break;}
     try{var obj=JSON.parse(chunk);var delta=obj.choices&&obj.choices[0]&&obj.choices[0].delta&&obj.choices[0].delta.content;if(typeof delta==='string'){messages[messages.length-1].content+=delta;render();}}catch(ignore){}
    }
   }
   if(!messages[messages.length-1].content.trim())throw new Error('回答が空でした。別のモデルで再試行してください。');
   status('完了');
  }
 }catch(e){
  if(e.name==='AbortError'){messages[messages.length-1].content='（生成を停止しました）';status('停止しました');}
  else{
   var msg=e.message||'不明なエラー';
   messages[messages.length-1].content='エラー: '+msg;
   status('エラー');
  }
 }finally{
  setBusy(false);controller=null;render();typesetMath();
 }
}
$('send').addEventListener('click',function(){send(false);});
$('prompt').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(false);}});
$('stop').addEventListener('click',function(){if(controller)controller.abort();});
$('new').addEventListener('click',function(){if(busy)return;messages=[];render();status('準備完了');$('prompt').focus();});
$('themeToggle').addEventListener('click',function(){document.body.classList.toggle('dark');var dark=document.body.classList.contains('dark');try{localStorage.setItem('groq-theme',dark?'dark':'light');}catch(ignore){}updateThemeButton();});
function updateThemeButton(){var dark=document.body.classList.contains('dark');$('themeToggle').textContent=dark?'白':'黒';$('themeToggle').title=dark?'白背景に切替':'黒背景に切替';$('themeToggle').setAttribute('aria-label',dark?'白背景に切替':'黒背景に切替');}
try{document.body.classList.toggle('dark',localStorage.getItem('groq-theme')==='dark');}catch(ignore){}
updateThemeButton();
$('openSettings').addEventListener('click',function(){$('key').value=apiKey;$('remember').checked=remember;$('instruction').value=instruction;$('settings').showModal();});
$('close').addEventListener('click',function(){$('settings').close();});
$('form').addEventListener('submit',function(e){e.preventDefault();saveSettings();$('settings').close();status(apiKey?'準備完了':'APIキー未設定');});
$('deleteKey').addEventListener('click',function(){apiKey='';remember=false;$('key').value='';$('remember').checked=false;localStorage.removeItem('groq-key');sessionStorage.removeItem('groq-key-session');status('APIキーを削除しました');});
})();
</script>
