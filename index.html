<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff">
<title>Groq AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{padding:8px 12px;border:1px solid #ddd;border-radius:7px;background:#fff;color:#222;cursor:pointer}button:hover{background:#f7f7f7}button:disabled{opacity:.45}button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #777;outline-offset:2px}
header{height:54px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;gap:9px;padding:0 14px}.brand{font-weight:600}.spacer{flex:1}select{max-width:42vw;padding:7px;border:1px solid #ddd;border-radius:7px;background:white;color:#222}
main{height:calc(100dvh - 54px);max-width:780px;margin:auto;padding:0 16px;display:flex;flex-direction:column}#messages{flex:1;overflow:auto;padding:24px 0}.welcome{color:#777;padding:18px 0}.message{padding:14px 0;border-bottom:1px solid #f0f0f0;overflow-wrap:anywhere}.role{font-size:12px;color:#777;margin-bottom:4px}.content{white-space:pre-wrap;overflow-wrap:anywhere}
.composer{padding:10px 0 max(12px,env(safe-area-inset-bottom));background:white}.box{display:flex;gap:8px;align-items:flex-end;border:1px solid #ccc;border-radius:9px;padding:7px}textarea{flex:1;min-width:0;min-height:40px;max-height:180px;resize:vertical;border:0;outline:none!important;padding:7px;color:#222;background:transparent}.send{background:#222;color:#fff;border-color:#222}.send:hover{background:#444}.note{font-size:11px;color:#777;margin-top:6px}.status{font-size:12px}
dialog{width:min(440px,calc(100vw - 28px));border:1px solid #ddd;border-radius:9px;padding:18px}dialog::backdrop{background:#0005}h2{font-size:18px;margin:0 0 16px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:14px}.field input[type=password],.field textarea{width:100%;border:1px solid #ddd;border-radius:7px;padding:10px;background:#fff;color:#222}.small{font-size:12px;color:#777}.check{display:flex;align-items:center;gap:8px;font-size:13px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:500px){header{padding:0 9px;gap:6px}.brand{font-size:15px}select{max-width:39vw;font-size:13px}main{padding:0 11px}#messages{padding-top:16px}}
</style></head><body>
<header><span class="brand">Groq AI</span><span class="spacer"></span><select id="model" aria-label="モデル"><option value="llama-3.3-70b-versatile">標準モデル</option></select><button id="new" type="button">新規</button><button id="openSettings" type="button">設定</button></header>
<main><div id="messages" aria-live="polite"><div class="welcome">メッセージを入力して始めてください。</div></div>
<div class="composer"><div class="box"><textarea id="prompt" rows="1" placeholder="メッセージを入力…" aria-label="メッセージ"></textarea><button id="stop" type="button" disabled>停止</button><button id="send" class="send" type="button">送信</button></div><div class="note"><span id="status" class="status">準備完了</span> · 個人情報は入力しないでください。AIの回答は間違うことがあります。</div></div></main>
<dialog id="settings"><form id="form"><h2>設定</h2><div class="field"><label for="key">Groq APIキー</label><input id="key" type="password" autocomplete="off" placeholder="gsk_…"><div class="small">共有端末ではキーを保存せず、使用後に削除してください。</div><label class="check"><input id="remember" type="checkbox">この端末にAPIキーを保存する</label></div><div class="field"><label for="instruction">追加指示（省略可）</label><textarea id="instruction" rows="3" placeholder="例：中学生にもわかる言葉で説明する"></textarea></div><div class="field"><button id="getModels" type="button">モデル一覧を取得</button><div class="small">Groq APIの利用にはAPIキーが必要です。</div></div><div class="actions"><button id="deleteKey" type="button">キーを削除</button><button id="close" type="button">閉じる</button><button type="submit" class="send">保存</button></div></form></dialog>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var apiKey=sessionStorage.getItem('groq-key-session')||localStorage.getItem('groq-key')||'';
var remember=!!localStorage.getItem('groq-key');
var instruction=sessionStorage.getItem('groq-instruction')||'';
var messages=[],busy=false,controller=null;
function status(t){$('status').textContent=t;}
function render(){
 var el=$('messages');
 if(!messages.length){el.innerHTML='<div class="welcome">メッセージを入力して始めてください。</div>';return;}
 el.innerHTML='';
 messages.forEach(function(m){var item=document.createElement('section');item.className='message';var role=document.createElement('div');role.className='role';role.textContent=m.role==='user'?'あなた':'Groq AI';var content=document.createElement('div');content.className='content';content.textContent=m.content;item.appendChild(role);item.appendChild(content);el.appendChild(item);});
 el.scrollTop=el.scrollHeight;
}
function saveSettings(){
 apiKey=$('key').value.trim();remember=$('remember').checked;instruction=$('instruction').value.trim();
 if(remember&&apiKey){localStorage.setItem('groq-key',apiKey);sessionStorage.removeItem('groq-key-session');}
 else{localStorage.removeItem('groq-key');if(apiKey)sessionStorage.setItem('groq-key-session',apiKey);else sessionStorage.removeItem('groq-key-session');}
 sessionStorage.setItem('groq-instruction',instruction);
}
async function getModels(){
 if(!apiKey){status('APIキーが必要です');$('settings').showModal();return;}
 status('取得中…');
 try{
  var r=await fetch('https://api.groq.com/openai/v1/models',{headers:{Authorization:'Bearer '+apiKey}});
  if(!r.ok)throw new Error('HTTP '+r.status);
  var data=await r.json(),list=(data.data||[]).filter(function(x){return x.id;}).sort(function(a,b){return a.id.localeCompare(b.id);});
  if(!list.length)throw new Error('モデルがありません');
  var before=$('model').value;$('model').innerHTML='';
  list.forEach(function(m){var op=document.createElement('option');op.value=m.id;op.textContent=m.id;$('model').appendChild(op);});
  if(list.some(function(m){return m.id===before;}))$('model').value=before;
  status('準備完了');
 }catch(e){status('取得失敗');alert('モデル一覧を取得できませんでした。APIキーを確認してください。\n'+e.message);}
}
async function send(){
 if(busy)return;var text=$('prompt').value.trim();if(!text)return;
 if(!apiKey){$('settings').showModal();status('APIキーを設定してください');return;}
 messages.push({role:'user',content:text});$('prompt').value='';render();
 busy=true;$('send').disabled=true;$('stop').disabled=false;controller=new AbortController();messages.push({role:'assistant',content:''});status('生成中…');render();
 try{
  var system='あなたは親切で正確なAIアシスタントです。日本語で、わかりやすく回答してください。'+(instruction?'\n追加指示: '+instruction:'');
  var context=[{role:'system',content:system}].concat(messages.slice(0,-1).map(function(m){return {role:m.role,content:m.content};}));
  var r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+apiKey,'Content-Type':'application/json'},body:JSON.stringify({model:$('model').value||'llama-3.3-70b-versatile',messages:context,temperature:0.5,stream:true}),signal:controller.signal});
  if(!r.ok)throw new Error('HTTP '+r.status+' — '+(await r.text()).slice(0,250));
  var reader=r.body.getReader(),decoder=new TextDecoder(),buffer='';
  while(true){
   var part=await reader.read();if(part.done)break;
   buffer+=decoder.decode(part.value,{stream:true});var lines=buffer.split('\n');buffer=lines.pop();
   for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();if(line.indexOf('data:')!==0)continue;var chunk=line.slice(5).trim();if(chunk==='[DONE]')continue;
    try{var obj=JSON.parse(chunk);messages[messages.length-1].content+=(obj.choices&&obj.choices[0]&&obj.choices[0].delta.content)||'';render();}catch(ignore){}
   }
  }
  status('完了');
 }catch(e){if(e.name==='AbortError')status('停止しました');else{messages[messages.length-1].content='エラー: '+e.message;render();status('エラー');}}
 finally{busy=false;controller=null;$('send').disabled=false;$('stop').disabled=true;}
}
$('send').onclick=send;
$('prompt').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
$('stop').onclick=function(){if(controller)controller.abort();};
$('new').onclick=function(){if(busy)return;messages=[];render();status('準備完了');$('prompt').focus();};
$('openSettings').onclick=function(){$('key').value=apiKey;$('remember').checked=remember;$('instruction').value=instruction;$('settings').showModal();};
$('close').onclick=function(){$('settings').close();};
$('form').onsubmit=function(e){e.preventDefault();saveSettings();$('settings').close();status(apiKey?'準備完了':'APIキー未設定');};
$('getModels').onclick=function(){saveSettings();getModels();};
$('deleteKey').onclick=function(){apiKey='';remember=false;$('key').value='';$('remember').checked=false;localStorage.removeItem('groq-key');sessionStorage.removeItem('groq-key-session');status('APIキーを削除しました');};
if(apiKey)getModels();
})();
</script></body></html>
